[project]
name = "gold-ai-scalper"
version = "0.1.0"
description = "GOLD AI ADAPTIVE AGENTIC SCALPER — adaptive multi-agent XAUUSD research, simulation and (owner-gated) MT5 execution platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "SQLAlchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
windows = ["MetaTrader5>=5.0.45"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
